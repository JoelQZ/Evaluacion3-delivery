server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: MS-CLIENTE
              uri: lb://MS-CLIENTE
              predicates:
                - Path=/api/clientes/**
            - id: MS-REPARTIDOR
              uri: lb://MS-REPARTIDOR
              predicates:
                - Path=/api/repartidores/**
            - id: MS-ENTREGA
              uri: lb://MS-ENTREGA
              predicates:
                - Path=/api/entregas/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
